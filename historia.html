<body data-page="historia">
<x-include src="partials/sprite.html"></x-include>
<x-include src="partials/header.html"></x-include>

<main id="conteudo">
  <!-- Abertura do capítulo (preenchida pelo historia.js conforme o hash) -->
  <section class="chapter-hero on-dark" aria-labelledby="ch-title" data-ch-hero data-hero>
    <div class="chapter-hero__bg" data-ch-bg></div>
    <div class="chapter-hero__veil"></div>
    <div class="container chapter-hero__content">
      <span class="chapter-hero__num num-accent" data-ch-num aria-hidden="true"></span>
      <p class="eyebrow" data-ch-eyebrow></p>
      <h1 id="ch-title" data-ch-title></h1>
      <p class="chapter-hero__lead" data-ch-lead></p>
    </div>
    <span class="placeholder-note" data-ch-ph></span>
  </section>

  <!-- Leitura + índice de capítulos: folha que sobe sobre a abertura -->
  <div class="ch-body sheet kraft">
  <div class="container reading">
    <aside class="toc" aria-label="Capítulos">
      <details class="toc__box" data-toc open>
        <summary><span class="eyebrow">Capítulos</span><span class="toc__current" data-toc-current></span><svg aria-hidden="true"><use href="#i-chevron-down"/></svg></summary>
        <ol class="toc__list" role="list" data-toc-list></ol>
      </details>
    </aside>
    <article class="prose" data-ch-body aria-labelledby="ch-title"></article>
  </div>
  </div>

  <!-- Navegação entre capítulos -->
  <section class="section chapters-nav bg-paper kraft" aria-labelledby="chnav-title">
    <div class="container">
      <div class="chapters-nav__head">
        <h2 id="chnav-title" class="h3">Da semente à <span class="accent">xícara</span></h2>
        <div class="chapters-nav__btns">
          <a class="btn btn--outline btn--sm" data-ch-prev href="#"><svg aria-hidden="true"><use href="#i-arrow-left"/></svg>Capítulo anterior</a>
          <a class="btn btn--brown btn--sm" data-ch-next href="#">Próximo capítulo<svg aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
        </div>
      </div>
      <ol class="ch-cards" role="list" data-ch-cards></ol>
    </div>
  </section>

  <!-- Faixa de conversão -->
  <section class="section taste on-dark bg-brown kraft" aria-labelledby="taste-title">
    <x-pic name="ramo-h-light" sizes="70vw" alt="" class="taste__deco"></x-pic>
    <div class="container taste__grid">
      <div class="taste__text">
        <p class="eyebrow">Do cafezal para a sua casa</p>
        <h2 id="taste-title">Prove essa <span class="script">história</span>.</h2>
        <p class="lead">Café 100% arábica de Garça/SP, entregue em todo o Brasil. No clube, torra fresca a cada envio e até 22% de desconto.</p>
        <div class="btn-row btn-row--stack">
          <a class="btn btn--buy btn--lg" href="https://loja.appassionatocafe.com.br/?utm_source=landing&amp;utm_medium=botao&amp;utm_content=historia" target="_blank" rel="noopener" data-track="comprar" data-track-place="historia">Comprar cafés</a>
          <a class="btn btn--sub btn--lg" href="https://loja.appassionatocafe.com.br/clube?utm_source=landing&amp;utm_medium=botao&amp;utm_content=historia" target="_blank" rel="noopener" data-track="assinar" data-track-place="historia">Assinar o clube</a>
        </div>
      </div>
      <div class="taste__cards" role="list" data-taste></div>
    </div>
  </section>
</main>

<x-include src="partials/footer.html"></x-include>
<script type="module" src="/src/js/historia.js"></script>

</html>
